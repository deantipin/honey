name: Demo secret

on: pull_request

permissions: {}

jobs:
  check:
    name: Secret configuration check
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # Educational configuration check, not a functional test of the website or an API.
      - name: Verify demo secret
        env:
          HONEY_DEMO_SECRET: ${{ secrets.HONEY_DEMO_SECRET }}
        shell: python
        run: |
          import hashlib
          import hmac
          import os
          import sys

          value = os.environ.get("HONEY_DEMO_SECRET", "")
          if not value:
              sys.exit("HONEY_DEMO_SECRET is missing")
          expected = "fc1ece01bd3ff5102978a75406dd80b7e32522b4134e1f223c03ea77c938c652"
          if not hmac.compare_digest(hashlib.sha256(value.encode()).hexdigest(), expected):
              sys.exit("HONEY_DEMO_SECRET does not match the configured demo value")
          print("HONEY_DEMO_SECRET is available and matches the configured demo value")
